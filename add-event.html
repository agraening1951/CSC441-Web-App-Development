<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <style>
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: rgb(248, 249, 205);
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
        }

        .form-container h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #023e8a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
             resize: vertical;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add a New Event</h2>
        <p>Submit a local San Diego event.</p>
        <form action="/add-event" method="POST">
            <fieldset>
                <legend>Event Information</legend>
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" name="eventName" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime" name="eventTime" required>
                </div>
                <div class="form-group">
                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required>
                </div>
                <div class="form-group">
                <label for="eventDescription">Description</label>
                <textarea id="eventDescription"
                        name="eventDescription"
                        rows="4"
                        placeholder="Enter a brief event description..."
                        required></textarea>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Category</label>
                    <select id="eventCategory" name="eventCategory" required>
                        <option value="Movies">Movies</option>
                        <option value="Surfing">Surfing</option>
                        <option value="Hiking">Hiking</option>
                        <option value="Farmer's Market">Farmer's Market</option>
                    </select>
                </div>
                <button type="submit">Add Event</button>
            </fieldset>
        </form>
        <a class="back-link" href="events.html">Back to Events Page</a>
    </div>
    
    <script>
        function convertTo12HourFormat(time24) {
            const [hours, minutes] = time24.split(":");
            let hours12 = parseInt(hours);
            const ampm = hours12 >= 12 ? "pm" : "am";
            hours12 = hours12 % 12 || 12;
            return `${hours12}:${minutes}${ampm}`;
        }
        
        document.querySelector("form").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const event = {
                name: document.getElementById("eventName").value,
                date: document.getElementById("eventDate").value,
                time: convertTo12HourFormat(document.getElementById("eventTime").value),
                location: document.getElementById("eventLocation").value,
                description: document.getElementById("eventDescription").value,
                category: document.getElementById("eventCategory").value.toLowerCase()
            };
            
            let events = JSON.parse(localStorage.getItem("events")) || [];
            events.push(event);
            localStorage.setItem("events", JSON.stringify(events));
            
            window.location.href = "events.html";
        });
    </script>
</body>
</html>
