<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>
    <style>
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: rgb(248, 249, 205);
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
        }

        .form-container h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #023e8a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
             resize: vertical;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add a New Event</h2>
        <p>Submit a local San Diego event.</p>
        <p>Submit through the local Express server at <strong>http://localhost:8080</strong>.</p>
        <form id="addEventForm" action="http://localhost:8080/api/events" method="POST">
            <fieldset>
                <legend>Event Information</legend>
                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" name="eventName" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime" name="eventTime" required>
                </div>
                <div class="form-group">
                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" name="eventLocation" required>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" name="eventDescription" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="eventNotes">Additional Notes</label>
                    <textarea id="eventNotes" name="eventNotes" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="eventWebsite">Website Link</label>
                    <input type="url" id="eventWebsite" name="eventWebsite" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Category</label>
                    <select id="eventCategory" name="eventCategory" required>
                        <option value="movies">Movies</option>
                        <option value="surfing">Surfing</option>
                        <option value="hiking">Hiking</option>
                        <option value="markets">Farmer's Market</option>
                    </select>
                </div>
                <button type="submit">Add Event</button>
            </fieldset>
        </form>
        <a class="back-link" href="events.html">Back to Events Page</a>
    </div>
    <script>
        const form = document.getElementById("addEventForm");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const formData = new URLSearchParams({
                eventName: document.getElementById("eventName").value,
                eventDate: document.getElementById("eventDate").value,
                eventTime: document.getElementById("eventTime").value,
                eventLocation: document.getElementById("eventLocation").value,
                eventDescription: document.getElementById("eventDescription").value,
                eventNotes: document.getElementById("eventNotes").value,
                eventWebsite: document.getElementById("eventWebsite").value,
                eventCategory: document.getElementById("eventCategory").value
            });

            const response = await fetch(form.action, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: formData.toString()
            });

            if (!response.ok) {
                throw new Error("Unable to save event.");
            }

            window.location.href = "events.html";
        });
    </script>
</body>
</html>
